<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare AI - Patient Portal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4ff; color: #1e293b; }
      :root {
        --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
        --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
        --gray-300: #cbd5e1; --gray-500: #64748b; --gray-700: #334155; --gray-900: #0f172a;
        --radius: 12px; --shadow: 0 4px 6px -1px rgba(0,0,0,.1);
      }
      .spinner { border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 40px auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="spinner"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
